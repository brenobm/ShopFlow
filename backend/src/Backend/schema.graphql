type ShoppingList {
  id: ID!
  name: String!
  owner: String
  members: [String]
  isDefault: Boolean
  items: [ShoppingItem]
  createdAt: AWSDateTime!
  updatedAt: String
}

type ShoppingItem {
  id: ID!
  listId: ID!
  name: String!
  quantity: Float
  price: Float
  unit: String
  category: String
  isPurchased: Boolean
}

type Query {
  getLists: [ShoppingList]
  getList(id: ID!): ShoppingList
  getItems(listId: ID!): [ShoppingItem]
  getGlobalProduct(barcode: String!): GlobalProduct
  getSuggestions: [String]
  productSearch(barcode: String!): Product
  parseItem(text: String!): SmartParseResult
}

type SmartParseResult {
    name: String
    quantity: Float
    unit: String
    category: String
    emoji: String
}

type Product {
    name: String
    category: String
    imageUrl: String
}

type Mutation {
  createList(name: String!, isDefault: Boolean): ShoppingList
  updateList(id: ID!, name: String, isDefault: Boolean): ShoppingList
  deleteList(id: ID!): ShoppingList
  shareList(id: ID!, email: String!): ShoppingList
  
  addItem(listId: ID!, name: String!, quantity: Float, price: Float, unit: String, category: String): ShoppingItem
  updateItem(listId: ID!, id: ID!, name: String, quantity: Float, price: Float, unit: String, category: String, isPurchased: Boolean): ShoppingItem
  deleteItem(listId: ID!, id: ID!): ShoppingItem
  
  createGlobalProduct(barcode: String!, name: String!, category: String): GlobalProduct
  
  registerDevice(token: String!, platform: String): DeviceToken
}

type DeviceToken {
  userId: ID!
  token: String!
  platform: String
  updatedAt: String
}

type GlobalProduct {
  barcode: String!
  name: String!
  category: String
}

type Subscription {
  onUpdateList(id: ID!): ShoppingList
    @aws_subscribe(mutations: ["updateList"])
  onUpdateItem(listId: ID!): ShoppingItem
    @aws_subscribe(mutations: ["addItem", "updateItem", "deleteItem"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
