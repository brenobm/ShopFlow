
type ShoppingList {
  id: ID!
  name: String!
  owner: String
  members: [String]
  items: [ShoppingItem]
  createdAt: String
  updatedAt: String
}

type ShoppingItem {
  id: ID!
  listId: ID!
  name: String!
  quantity: Float
  unit: String
  category: String
  isPurchased: Boolean
}

type Query {
  getLists: [ShoppingList]
  getList(id: ID!): ShoppingList
  getItems(listId: ID!): [ShoppingItem]
  getGlobalProduct(barcode: String!): GlobalProduct
}

type Mutation {
  createList(name: String!): ShoppingList
  updateList(id: ID!, name: String!): ShoppingList
  deleteList(id: ID!): ShoppingList
  shareList(id: ID!, email: String!): ShoppingList
  
  addItem(listId: ID!, name: String!, quantity: Float, unit: String, category: String): ShoppingItem
  updateItem(listId: ID!, id: ID!, name: String, quantity: Float, unit: String, category: String, isPurchased: Boolean): ShoppingItem
  deleteItem(listId: ID!, id: ID!): ShoppingItem
  
  createGlobalProduct(barcode: String!, name: String!, category: String): GlobalProduct
}

type GlobalProduct {
  barcode: String!
  name: String!
  category: String
}

type Subscription {
  onUpdateList(id: ID!): ShoppingList
    @aws_subscribe(mutations: ["updateList"])
  onUpdateItem(listId: ID!): ShoppingItem
    @aws_subscribe(mutations: ["addItem", "updateItem", "deleteItem"])
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
