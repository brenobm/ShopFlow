name: Deploy iOS to TestFlight

on:
  push:
    branches: [ "main" ] # Trigger on push to main branch
  workflow_dispatch:      # Allows manual trigger

jobs:
  build:
    runs-on: macos-26 # The virtual Mac

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x # Or 9.0.x depending on your project

    - name: Install MAUI Workload
      run: dotnet workload install maui-ios maui-android maui-maccatalyst

    # Install the Apple Certificate and Provisioning Profile
    - name: Install Apple Certificate
      uses: apple-actions/import-codesign-certs@v3
      with:
        p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        p12-password: ${{ secrets.P12_PASSWORD }}

    - name: Install Provisioning Profile
      uses: apple-actions/download-provisioning-profiles@v3
      with:
        bundle-id: 'com.brenomachado.shopflow' # Match your App ID
        profile-type: 'IOS_APP_STORE'
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

    # Build the App (Generates .ipa)
    - name: Build .NET MAUI iOS App
      run: |
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="Apple Distribution: Breno Batista Machado (8L386BMNSL)" -p:CodesignProvision="GitHubAppleStore"

    # Upload to TestFlight
    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: 'bin/Release/net10.0-ios/ios-arm64/publish/ShopFlow.ipa'
        issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}